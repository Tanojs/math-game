name: Buat keystore (sekali saja)
# Membuat kunci penandatangan APK. Jalankan SEKALI, simpan hasilnya di tempat aman (di luar GitHub juga),
# lalu isi 3 secret repo. JALANKAN HANYA DI REPO PRIVATE: artifact berisi kunci + password (di repo publik bisa diunduh siapa pun). Jangan pernah mengganti kunci ini: kunci yang berbeda = APK tidak bisa update aplikasi lama.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Buat keystore
        run: |
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair -storetype PKCS12 -keystore math-games.jks -alias mathgames \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Math Games, O=Tano Store, C=ID"
          base64 -w0 math-games.jks > keystore.b64
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=mathgames"
            echo "ANDROID_KEYSTORE_BASE64 = isi file keystore.b64 (satu baris panjang)"
          } > secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-math-games
          path: |
            math-games.jks
            keystore.b64
            secrets.txt
          retention-days: 1
