<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFE14D" />
    <title>Math Games</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <div id="home">
        <div class="hd">
          <h1 class="logo" aria-label="Math Games">
            <span class="lg-tiles">
              <span class="lt" style="--t:var(--c);--r:-7deg">M</span><span class="lt" style="--t:var(--k);--r:5deg;--d:.1s">A</span><span class="lt" style="--t:var(--o);--r:-3deg;--d:.2s">T</span><span class="lt" style="--t:var(--g);--r:6deg;--d:.3s">H</span>
              <span class="lo lo-plus">+</span><span class="lo lo-times">×</span>
            </span>
            <span class="lg-ribbon">GAMES</span>
          </h1>
          <button id="tq" class="tq" aria-label="Ganti tema"></button>
        </div>
        <div id="hg"></div>
      </div>
      <div id="gm" class="hide">
        <div class="bar">
          <button class="bk" id="bk" aria-label="Kembali">←</button>
          <h2 id="gt"></h2>
          <span class="inf" id="inf"></span>
        </div>
        <div id="st"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
